# Este repositório não é distribuído como pacote instalável: as dependências
# ficam em requirements.txt e a aplicação é executada a partir de `fastapi/`.
# Este arquivo concentra apenas a configuração das ferramentas de qualidade.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["fastapi"]
extend-exclude = [".venv", "eda"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
# Módulos locais da aplicação: vivem na raiz de `fastapi/` e são importados
# de forma absoluta, já que a app é executada de dentro desse diretório.
known-first-party = [
    "application",
    "config",
    "conftest",
    "crud",
    "database",
    "domain",
    "main",
    "models",
    "routes",
    "security",
    "sqlite_database",
    "sqlite_populate",
]
