name: CI

# Executa a suíte de testes a cada push (em qualquer branch) e em pull requests.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
      ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      # O pytest devolve código de saída diferente de zero se qualquer teste falhar,
      # o que encerra o job (e o workflow) com erro.
      - name: Run tests
        run: pytest tests/ -v
